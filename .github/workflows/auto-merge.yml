name: Auto-merge PR

on:
  workflow_run:
    workflows: ["Plugin PR Audit"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download PR info
        uses: actions/download-artifact@v4
        with:
          name: pr-info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Read PR info and Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=""
          if [ -f "pr-info.json" ]; then
            PR_NUM=$(jq -r '.prNumber // empty' pr-info.json)
          fi
          
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            PR_NUM="${{ github.event.workflow_run.pull_requests[0].number }}"
          fi

          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "No PR number detected, skipping auto-merge."
            exit 0
          fi

          echo "🚀 Processing auto-merge for PR #$PR_NUM..."
          
          # 1. 自动打上 auto-merge-ready 标签
          gh pr edit "$PR_NUM" --add-label "auto-merge-ready" || true
          
          # 2. 自动 Approve
          gh pr review "$PR_NUM" --approve --body "🤖 Auto-approved by Plugin Audit CI (All checks passed)" || true
          
          # 3. 自动 Squash Merge
          gh pr merge "$PR_NUM" --squash --admin || gh pr merge "$PR_NUM" --squash || true
